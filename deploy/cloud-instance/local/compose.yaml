services:
  cindy-cloud:
    build:
      context: ../../..
      dockerfile: deploy/cloud-instance/local/Dockerfile
    # Only linux/amd64 assets are pinned today. Pinning the platform keeps
    # Apple Silicon hosts from building an arm64 image that the capability
    # gate rejects (exit 78); Docker Desktop runs it via Rosetta.
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      DISPLAY: :99
      # ELECTRON_DISABLE_SANDBOX / XDT_DEV_SAFE_STORAGE_BASIC are baked into
      # the image ENV (see the Dockerfile) so provider-launched containers get
      # them too; compose does not re-declare them.
      XDT_POD_ACCOUNT_REFRESH_TOKEN_FILE: /run/secrets/pod_account_refresh_token
      XDT_POD_DEVICE_ID: ${XDT_POD_DEVICE_ID:?set XDT_POD_DEVICE_ID to the provisioned stable Pod id}
      XDT_ENDPOINT_MANIFEST_FILE: /run/config/endpoint.local.json
      XDT_USER_DATA_DIR: /var/lib/cindy/user-data
      CINDY_CLOUD_STATUS_FILE: /var/lib/cindy/status/status.json
    secrets:
      - pod_account_refresh_token
    volumes:
      - cindy-cloud-user-data:/var/lib/cindy/user-data
      - cindy-cloud-status:/var/lib/cindy/status
      - cindy-cloud-workspaces:/var/lib/cindy/workspaces
      - type: bind
        source: ${CINDY_ENDPOINT_MANIFEST_FILE:?set CINDY_ENDPOINT_MANIFEST_FILE to a host-reachable endpoint.local.json}
        target: /run/config/endpoint.local.json
        read_only: true
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/cindy-cloud-healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

secrets:
  pod_account_refresh_token:
    file: ${CINDY_POD_REFRESH_TOKEN_FILE:?set CINDY_POD_REFRESH_TOKEN_FILE to a gitignored secret file}

volumes:
  cindy-cloud-user-data:
  cindy-cloud-status:
  cindy-cloud-workspaces:

networks:
  default:
    name: cindy-cloud-local
    driver: bridge
    enable_ipv6: false
    attachable: false
    labels:
      com.cindy.cloud.runtime: local
      com.cindy.cloud.runtime.environment: development
      com.cindy.cloud.runtime.docker-socket: "absent"

# The LocalDockerProvider owns the Docker API on the host side. Never add
# /var/run/docker.sock to this data-plane service.
